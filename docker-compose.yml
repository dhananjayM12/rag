services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: upsc
      POSTGRES_PASSWORD: upsc
      POSTGRES_DB: upsc
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U upsc"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://upsc:upsc@db:5432/upsc
      CORS_ORIGINS: http://localhost:3000
      EMBED_DIM: "384"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      API_URL_INTERNAL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
